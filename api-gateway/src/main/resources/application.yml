spring:
  application:
    name: api-gateway


server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:desco-super-secret-key-must-be-at-least-256-bits-long-for-hs256}


management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.desco.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
