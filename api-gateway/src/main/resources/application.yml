spring:
  application:
    name: api-gateway

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:desco-super-secret-key-must-be-at-least-256-bits-long-for-hs256}

# Downstream service URLs are read directly from the environment by GatewayConfig's
# @Value defaults (docker-compose hostnames). run-local.sh exports them as localhost
# URLs for local dev — no need to redeclare them here too.

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.desco.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
