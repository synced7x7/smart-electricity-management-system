spring:
  application:
    name: complaint-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${DB_USERNAME:postgres.zwymhosocnbkwjhyirui}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:

      maximum-pool-size: 3
      minimum-idle: 0
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:

      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8085

jwt:
  secret: ${JWT_SECRET:desco-super-secret-key-must-be-at-least-256-bits-long-for-hs256}

notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8084}

user:
  service:
    url: ${USER_SERVICE_URL:http://user-service:8082}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.desco.complaint: DEBUG
