spring:
  application:
    name: complaint-service

  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://config-server:8888}"

  cloud:
    config:
      username: ${CONFIG_SERVER_USERNAME:config-user}
      password: ${CONFIG_SERVER_PASSWORD:config-secret}
      fail-fast: false
      retry:
        initial-interval: 1000
        max-attempts: 6
        max-interval: 2000

  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${DB_USERNAME:postgres.zwymhosocnbkwjhyirui}
    password: ${DB_PASSWORD:IEXR4qRJzjpLD0Bh}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8085

jwt:
  secret: ${JWT_SECRET:desco-super-secret-key-must-be-at-least-256-bits-long-for-hs256}

notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8084}

user:
  service:
    url: ${USER_SERVICE_URL:http://user-service:8082}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.desco.complaint: DEBUG
