spring:
  application:
    name: payment-service

  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://config-server:8888}"

  cloud:
    config:
      username: ${CONFIG_SERVER_USERNAME:config-user}
      password: ${CONFIG_SERVER_PASSWORD:config-secret}
      fail-fast: false
      retry:
        initial-interval: 1000
        max-attempts: 6
        max-interval: 2000

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Supabase's session-mode pooler caps total clients at 15 across ALL services.
      # Keep each service's pool small so several can run at once.
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      # Schema is managed externally in Supabase (native enum types, uuid defaults).
      # Never let Hibernate alter it.
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8086

jwt:
  # Must match auth-service's secret — payment-service only validates tokens, it never issues them.
  secret: ${JWT_SECRET:desco-super-secret-key-must-be-at-least-256-bits-long-for-hs256}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.desco.payment: DEBUG
