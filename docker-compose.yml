services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-descodb}
      POSTGRES_USER: ${POSTGRES_USER:-desco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desco_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-desco}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-gateway:
    build: ./api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      OUTAGE_SERVICE_URL: http://outage-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      COMPLAINT_SERVICE_URL: http://complaint-service:8085
      PAYMENT_SERVICE_URL: http://payment-service:8086
      ADMIN_SERVICE_URL: http://admin-service:8087

  auth-service:
    build: ./auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-descodb}
      POSTGRES_USER: ${POSTGRES_USER:-desco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desco_local_password}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build: ./user-service
    ports:
      - "${USER_SERVICE_PORT:-8082}:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-descodb}
      POSTGRES_USER: ${POSTGRES_USER:-desco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desco_local_password}
    depends_on:
      postgres:
        condition: service_healthy

  outage-service:
    build: ./outage-service
    ports:
      - "${OUTAGE_SERVICE_PORT:-8083}:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-descodb}
      POSTGRES_USER: ${POSTGRES_USER:-desco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desco_local_password}
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8084}:8084"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-descodb}
      POSTGRES_USER: ${POSTGRES_USER:-desco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desco_local_password}
    depends_on:
      postgres:
        condition: service_healthy

  complaint-service:
    build: ./complaint-service
    ports:
      - "${COMPLAINT_SERVICE_PORT:-8085}:8085"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-descodb}
      POSTGRES_USER: ${POSTGRES_USER:-desco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desco_local_password}
    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    build: ./payment-service
    ports:
      - "${PAYMENT_SERVICE_PORT:-8086}:8086"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-descodb}
      POSTGRES_USER: ${POSTGRES_USER:-desco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desco_local_password}
    depends_on:
      postgres:
        condition: service_healthy

  admin-service:
    build: ./admin-service
    ports:
      - "${ADMIN_SERVICE_PORT:-8087}:8087"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-descodb}
      POSTGRES_USER: ${POSTGRES_USER:-desco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desco_local_password}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
