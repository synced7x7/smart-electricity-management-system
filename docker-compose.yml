services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-desco}
      POSTGRES_USER: ${POSTGRES_USER:-desco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desco_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-desco} -d ${POSTGRES_DB:-desco}"]
      interval: 5s
      timeout: 5s
      retries: 5

  config-server:
    build: ./config-server
    ports:
      - "${CONFIG_SERVER_PORT:-8888}:8888"

  api-gateway:
    build: ./api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      CONFIG_SERVER_URI: http://config-server:8888
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      CONFIG_SERVER_PORT: 8888
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      OUTAGE_SERVICE_URL: http://outage-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      COMPLAINT_SERVICE_URL: http://complaint-service:8085
      PAYMENT_SERVICE_URL: http://payment-service:8086
      ADMIN_SERVICE_URL: http://admin-service:8087
    depends_on:
      - config-server

  auth-service:
    build: ./auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-desco}
      DB_USERNAME: ${POSTGRES_USER:-desco}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-desco_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-desco}
      POSTGRES_USER: ${POSTGRES_USER:-desco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desco_local_password}
      CONFIG_SERVER_URI: http://config-server:8888
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      CONFIG_SERVER_PORT: 8888
      JWT_SECRET: ${JWT_SECRET:-desco-super-secret-key-must-be-at-least-256-bits-long-for-hs256}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_started

  user-service:
    build: ./user-service
    ports:
      - "${USER_SERVICE_PORT:-8082}:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-desco}
      DB_USERNAME: ${POSTGRES_USER:-desco}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-desco_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-desco}
      POSTGRES_USER: ${POSTGRES_USER:-desco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desco_local_password}
      CONFIG_SERVER_URI: http://config-server:8888
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      CONFIG_SERVER_PORT: 8888
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_started

  outage-service:
    build: ./outage-service
    ports:
      - "${OUTAGE_SERVICE_PORT:-8083}:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-desco}
      DB_USERNAME: ${POSTGRES_USER:-desco}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-desco_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-desco}
      POSTGRES_USER: ${POSTGRES_USER:-desco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desco_local_password}
      CONFIG_SERVER_URI: http://config-server:8888
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      CONFIG_SERVER_PORT: 8888
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_started

  notification-service:
    build: ./notification-service
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8084}:8084"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-desco}
      DB_USERNAME: ${POSTGRES_USER:-desco}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-desco_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-desco}
      POSTGRES_USER: ${POSTGRES_USER:-desco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desco_local_password}
      CONFIG_SERVER_URI: http://config-server:8888
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      CONFIG_SERVER_PORT: 8888
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_started

  complaint-service:
    build: ./complaint-service
    ports:
      - "${COMPLAINT_SERVICE_PORT:-8085}:8085"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-desco}
      DB_USERNAME: ${POSTGRES_USER:-desco}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-desco_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-desco}
      POSTGRES_USER: ${POSTGRES_USER:-desco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desco_local_password}
      CONFIG_SERVER_URI: http://config-server:8888
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      CONFIG_SERVER_PORT: 8888
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
