server:
  port: ${USER_SERVICE_PORT:8082}

spring:
  application:
    name: user-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://config-server:8888}
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:desco}}
    username: ${DB_USERNAME:${POSTGRES_USER:desco}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:desco_local_password}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
