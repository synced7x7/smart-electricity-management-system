spring:
  application:
    name: user-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Supabase's session-mode pooler caps total clients at ~15 across ALL
      # services. Seven services x 5 was 35 potential connections, and under
      # load that saturates the pooler — auth-service and notification-service
      # both failed to BOOT with "Connect timed out" during a heavy test run.
      #
      # minimum-idle: 0 matters more than the max: an idle service then holds
      # no connection at all, so the practical concurrent total stays well
      # below the cap instead of every service squatting on five.
      maximum-pool-size: 3
      minimum-idle: 0
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      # Both `users` and `user_profiles` already exist with a hand-designed schema
      # (FK constraint, unique constraint on meter_number, an updated_at trigger).
      # Never let Hibernate alter it.
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${USER_SERVICE_PORT:8082}

jwt:
  # Must match auth-service's secret — user-service only validates tokens, it never issues them.
  secret: ${JWT_SECRET:desco-super-secret-key-must-be-at-least-256-bits-long-for-hs256}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.desco.userservice: DEBUG
