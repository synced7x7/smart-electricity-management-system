spring:
  application:
    name: user-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Supabase's session-mode pooler caps total clients at 15 across ALL services.
      # Keep each service's pool small so several can run at once.
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      # Both `users` and `user_profiles` already exist with a hand-designed schema
      # (FK constraint, unique constraint on meter_number, an updated_at trigger).
      # Never let Hibernate alter it.
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${USER_SERVICE_PORT:8082}

jwt:
  # Must match auth-service's secret — user-service only validates tokens, it never issues them.
  secret: ${JWT_SECRET:desco-super-secret-key-must-be-at-least-256-bits-long-for-hs256}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.desco.userservice: DEBUG
