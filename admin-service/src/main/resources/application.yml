spring:
  application:
    name: admin-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8087

jwt:
 # kept the initial template. not changing it to maintain consistency
  secret: ${JWT_SECRET:desco-super-secret-key-must-be-at-least-256-bits-long-for-hs256}

desco:
  services:
    auth: ${AUTH_SERVICE_URL:http://localhost:8081}
    user: ${USER_SERVICE_URL:http://localhost:8082}
    outage: ${OUTAGE_SERVICE_URL:http://localhost:8083}
    notification: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
    complaint: ${COMPLAINT_SERVICE_URL:http://localhost:8085}
    payment: ${PAYMENT_SERVICE_URL:http://localhost:8086}
  health-timeout-ms: 4000

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.desco.admin: DEBUG
