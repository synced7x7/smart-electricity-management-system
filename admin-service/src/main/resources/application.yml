spring:
  application:
    name: admin-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Supabase's session-mode pooler caps total clients at ~15 across ALL
      # services. Seven services x 5 was 35 potential connections, and under
      # load that saturates the pooler — auth-service and notification-service
      # both failed to BOOT with "Connect timed out" during a heavy test run.
      #
      # minimum-idle: 0 matters more than the max: an idle service then holds
      # no connection at all, so the practical concurrent total stays well
      # below the cap instead of every service squatting on five.
      maximum-pool-size: 3
      minimum-idle: 0
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      # Schema is managed externally in Supabase (native enum types, uuid defaults).
      # Never let Hibernate alter it.
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8087

jwt:
  # Must match auth-service's secret — admin-service only validates tokens.
  secret: ${JWT_SECRET:desco-super-secret-key-must-be-at-least-256-bits-long-for-hs256}

# Sibling services polled for the dashboard's live status panel.
# Unreachable services are reported as DOWN rather than failing the request.
desco:
  services:
    auth: ${AUTH_SERVICE_URL:http://localhost:8081}
    user: ${USER_SERVICE_URL:http://localhost:8082}
    outage: ${OUTAGE_SERVICE_URL:http://localhost:8083}
    notification: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
    complaint: ${COMPLAINT_SERVICE_URL:http://localhost:8085}
    payment: ${PAYMENT_SERVICE_URL:http://localhost:8086}
  health-timeout-ms: 4000

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.desco.admin: DEBUG
