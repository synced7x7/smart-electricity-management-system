spring:
  application:
    name: outage-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${DB_USERNAME:postgres.zwymhosocnbkwjhyirui}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Supabase's session-mode pooler caps total clients at ~15 across ALL
      # services. Seven services x 5 was 35 potential connections, and under
      # load that saturates the pooler — auth-service and notification-service
      # both failed to BOOT with "Connect timed out" during a heavy test run.
      #
      # minimum-idle: 0 matters more than the max: an idle service then holds
      # no connection at all, so the practical concurrent total stays well
      # below the cap instead of every service squatting on five.
      maximum-pool-size: 3
      minimum-idle: 0
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      # Schema is hand-designed and managed externally in Supabase (native enum
      # types, FK constraints, triggers). `update` previously corrupted this schema by
      # silently adding duplicate/invented columns — never let Hibernate alter it.
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8083

jwt:
  secret: ${JWT_SECRET:desco-super-secret-key-must-be-at-least-256-bits-long-for-hs256}

notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8084}

user:
  service:
    url: ${USER_SERVICE_URL:http://user-service:8082}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.desco.outage: DEBUG
