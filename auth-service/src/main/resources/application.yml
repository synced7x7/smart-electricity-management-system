server:
  port: ${AUTH_SERVICE_PORT:8081}

spring:
  application:
    name: auth-service
  config:
    import: optional:configserver:http://localhost:${CONFIG_SERVER_PORT:8888}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:descodb}
    username: ${POSTGRES_USER:desco}
    password: ${POSTGRES_PASSWORD:desco_local_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-string}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
